<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beautiful Prompter</title>
<script>
  (function () {
    try {
      // A cookie, not localStorage: the port changes on every run, and localStorage
      // is scoped per origin (host + port), so it would never be seen again.
      var m = document.cookie.match(/(?:^|; )bpTheme=(dark|light)/);
      var stored = m ? m[1] : null;
      var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.documentElement.classList.add("dark");
    } catch (e) {}
  })();
</script>
<script src="https://cdn.tailwindcss.com/3.4.17?plugins=typography"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          paper: { bg: "#f6f3ee", surface: "#fbf9f6", border: "#e3ddd3", ink: "#1f1d1a", muted: "#7a6f63" },
          ink:   { bg: "#15171c", surface: "#1b1e24", border: "#2a2e36", text: "#e6e4df", muted: "#9aa0ab" }
        }
      }
    }
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script type="application/json" id="bp-config">__BP_CONFIG__</script>
<style>
  html { color-scheme: light; }
  html.dark { color-scheme: dark; }
  [hidden] { display: none !important; }
  textarea { resize: none; }
  #answer { resize: vertical; }
  textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid #7a6f63; outline-offset: 2px; }
  html.dark textarea:focus-visible, html.dark button:focus-visible, html.dark a:focus-visible { outline-color: #9aa0ab; }
  .prose pre { white-space: pre-wrap; word-break: break-word; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="h-full bg-paper-bg text-paper-ink dark:bg-ink-bg dark:text-ink-text antialiased">

<div id="app" class="h-full flex flex-col">
  <header class="flex items-center gap-4 px-5 py-2.5 text-sm border-b border-paper-border bg-paper-surface dark:border-ink-border dark:bg-ink-surface">
    <span id="brand" class="font-semibold tracking-tight">Beautiful Prompter</span>
    <span id="pill" class="rounded-full px-3 py-0.5 text-xs bg-paper-border/70 text-paper-muted dark:bg-ink-border dark:text-ink-muted"></span>
    <span class="flex-1"></span>
    <span id="context" hidden class="min-w-0 truncate text-xs text-paper-muted dark:text-ink-muted"></span>
    <button id="theme-toggle" type="button" title="Switch between light and dark" aria-label="Switch between light and dark"
            class="rounded-md p-1.5 text-paper-muted hover:text-paper-ink dark:text-ink-muted dark:hover:text-ink-text">
      <svg class="h-4 w-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="hidden h-4 w-4 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="flex-1 min-h-0">
    <section id="write" hidden class="h-full flex flex-col items-center px-4 pt-4">
      <div class="w-full max-w-3xl flex-1 min-h-0 flex flex-col rounded-t-lg border border-b-0 border-paper-border bg-paper-surface dark:border-ink-border dark:bg-ink-surface">
        <div role="tablist" class="flex gap-5 px-5 pt-2 text-sm border-b border-paper-border dark:border-ink-border">
          <button id="tab-write" type="button" role="tab" aria-selected="true"
                  class="pb-2 -mb-px border-b-2 border-paper-ink font-semibold dark:border-ink-text">Write</button>
          <button id="tab-preview" type="button" role="tab" aria-selected="false"
                  class="pb-2 -mb-px border-b-2 border-transparent text-paper-muted hover:text-paper-ink dark:text-ink-muted dark:hover:text-ink-text">Preview</button>
        </div>
        <textarea id="editor" spellcheck="true" placeholder="Write your prompt in markdown."
                  class="flex-1 w-full p-5 font-mono text-[13.5px] leading-relaxed bg-transparent focus:outline-none placeholder:text-paper-muted/70 dark:placeholder:text-ink-muted/70"></textarea>
        <div id="preview" hidden class="flex-1 min-h-0 overflow-y-auto p-5 prose prose-sm md:prose-base max-w-none dark:prose-invert"></div>
      </div>
    </section>

    <section id="show" hidden class="h-full flex flex-col">
      <div class="flex-1 min-h-0 overflow-y-auto">
        <article id="document" class="prose prose-sm md:prose-base max-w-3xl mx-auto px-6 py-8 dark:prose-invert"></article>
      </div>
      <div class="border-t border-paper-border bg-paper-surface dark:border-ink-border dark:bg-ink-surface">
        <div class="max-w-3xl mx-auto px-6 pt-4 pb-2">
          <label for="answer" class="block text-xs mb-1.5 text-paper-muted dark:text-ink-muted">Your answer</label>
          <textarea id="answer" rows="5" placeholder="What do you think? Markdown works here too."
                    class="w-full rounded-lg p-3 text-sm leading-relaxed bg-paper-bg border border-paper-border dark:bg-ink-bg dark:border-ink-border placeholder:text-paper-muted/70 dark:placeholder:text-ink-muted/70"></textarea>
        </div>
      </div>
    </section>
  </main>

  <div id="error" hidden role="alert" class="px-5 py-2 text-sm bg-red-50 text-red-800 border-t border-red-200 dark:bg-red-950 dark:text-red-200 dark:border-red-900"></div>

  <footer class="flex items-center gap-4 px-5 py-2.5 text-xs border-t border-paper-border bg-paper-surface text-paper-muted dark:border-ink-border dark:bg-ink-surface dark:text-ink-muted">
    <span>Markdown. <kbd class="rounded px-1 bg-paper-border/70 dark:bg-ink-border font-mono">Cmd/Ctrl+Enter</kbd> to send</span>
    <span id="count"></span>
    <span class="flex-1"></span>
    <a id="cancel" href="#" class="underline underline-offset-2 hover:text-paper-ink dark:hover:text-ink-text">Cancel</a>
    <button id="send" type="button" disabled
            class="rounded-lg px-4 py-1.5 text-sm font-semibold bg-paper-ink text-paper-surface disabled:opacity-40 disabled:cursor-not-allowed dark:bg-ink-text dark:text-ink-bg">Send to Claude</button>
  </footer>
</div>

<div id="idle" hidden class="h-full flex items-center justify-center px-6 text-center">
  <div>
    <div id="idle-mark" class="mx-auto mb-4 h-12 w-12 rounded-full flex items-center justify-center text-2xl bg-emerald-100 text-emerald-800 dark:bg-emerald-900 dark:text-emerald-200">&#10003;</div>
    <h1 id="idle-title" class="text-lg font-semibold">Sent. Go back to your terminal.</h1>
    <p id="idle-text" class="mt-1 text-sm text-paper-muted dark:text-ink-muted">Claude has your message. You can close this tab.</p>
  </div>
</div>

<script>
  var COPY = {
    confirmSend: "Send this to Claude? You won't be able to edit it afterwards.",
    confirmCancel: "Cancel without sending?",
    sentTitle: "Sent. Go back to your terminal.",
    sentText: "Claude has your message. You can close this tab.",
    cancelledTitle: "Cancelled. Go back to your terminal.",
    cancelledText: "Nothing was sent. You can close this tab."
  };

  var cfg = JSON.parse(document.getElementById("bp-config").textContent);
  var $ = function (id) { return document.getElementById(id); };
  var done = false;
  var busy = false;

  function source() { return cfg.mode === "write" ? $("editor") : $("answer"); }

  function refresh() {
    var text = source().value;
    $("count").textContent = text.length ? text.length + " chars" : "";
    $("send").disabled = busy || !text.trim();
  }

  var canRender = typeof marked !== "undefined";

  function renderMarkdown(target, text) {
    if (canRender) {
      target.innerHTML = marked.parse(text, { gfm: true });
      return;
    }
    var pre = document.createElement("pre");
    var code = document.createElement("code");
    code.textContent = text;
    pre.appendChild(code);
    target.replaceChildren(pre);
  }

  function showError(message) {
    $("error").textContent = message;
    $("error").hidden = false;
  }

  function finish(kind) {
    done = true;
    $("idle-title").textContent = kind === "sent" ? COPY.sentTitle : COPY.cancelledTitle;
    $("idle-text").textContent = kind === "sent" ? COPY.sentText : COPY.cancelledText;
    if (kind !== "sent") {
      $("idle-mark").className = "mx-auto mb-4 h-12 w-12 rounded-full flex items-center justify-center text-2xl bg-paper-border text-paper-muted dark:bg-ink-border dark:text-ink-muted";
      $("idle-mark").innerHTML = "&ndash;";
    }
    $("app").hidden = true;
    $("idle").hidden = false;
  }

  function post(path, body) {
    body.k = cfg.token;
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.ok && data.ok) return data;
        if (res.status === 409) throw new Error("Already answered from another tab. This process is exiting; nothing more can be sent here.");
        throw new Error("Couldn't send (HTTP " + res.status + (data.error ? ": " + data.error : "") + "). Your text is still here. Try again.");
      });
    }, function () {
      throw new Error("Couldn't reach the Beautiful Prompter process. It may have exited. Copy your text before closing this tab.");
    });
  }

  function send() {
    if (done || busy || $("send").disabled) return;
    if (!confirm(COPY.confirmSend)) return;
    busy = true;
    $("error").hidden = true;
    $("send").textContent = "Sending...";
    refresh();
    post("/answer", { text: source().value }).then(function () {
      finish("sent");
    }, function (err) {
      busy = false;
      $("send").textContent = "Send to Claude";
      refresh();
      showError(err.message);
    });
  }

  function cancel(event) {
    if (event) event.preventDefault();
    if (done || busy) return;
    if (!confirm(COPY.confirmCancel)) return;
    busy = true;
    refresh();
    post("/cancel", {}).then(function () {
      finish("cancelled");
    }, function (err) {
      busy = false;
      refresh();
      showError(err.message);
    });
  }

  var TAB_ON = "pb-2 -mb-px border-b-2 border-paper-ink font-semibold dark:border-ink-text";
  var TAB_OFF = "pb-2 -mb-px border-b-2 border-transparent text-paper-muted hover:text-paper-ink dark:text-ink-muted dark:hover:text-ink-text";

  function showTab(name) {
    var preview = name === "preview";
    if (preview) renderMarkdown($("preview"), $("editor").value);
    $("preview").hidden = !preview;
    $("editor").hidden = preview;
    $("tab-preview").className = preview ? TAB_ON : TAB_OFF;
    $("tab-write").className = preview ? TAB_OFF : TAB_ON;
    $("tab-preview").setAttribute("aria-selected", String(preview));
    $("tab-write").setAttribute("aria-selected", String(!preview));
    if (!preview) $("editor").focus();
  }

  function renderContext() {
    var ctx = cfg.context || {};
    var el = $("context");
    if (!ctx.folder) return;
    var folder = document.createElement("b");
    folder.className = "font-semibold text-paper-ink dark:text-ink-text";
    folder.textContent = ctx.folder;
    if (ctx.path) folder.title = ctx.path;
    el.appendChild(folder);
    if (ctx.repo) el.appendChild(document.createTextNode(" \u00b7 " + ctx.repo));
    if (ctx.branch) {
      el.appendChild(document.createTextNode(" \u00b7 "));
      var branch = document.createElement("span");
      branch.className = "font-mono";
      branch.textContent = ctx.branch;
      el.appendChild(branch);
    }
    el.hidden = false;
  }

  function toggleTheme() {
    var dark = document.documentElement.classList.toggle("dark");
    try { document.cookie = "bpTheme=" + (dark ? "dark" : "light") + "; Max-Age=31536000; Path=/; SameSite=Lax"; } catch (e) {}
  }

  (function init() {
    var brand = cfg.title || "Beautiful Prompter";
    $("brand").textContent = brand;
    document.title = brand;

    $("send").addEventListener("click", send);
    $("cancel").addEventListener("click", cancel);
    $("theme-toggle").addEventListener("click", toggleTheme);
    renderContext();
    document.addEventListener("keydown", function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); send(); }
    });
    window.addEventListener("beforeunload", function (e) {
      if (!done && source().value.trim()) { e.preventDefault(); e.returnValue = ""; }
    });
    if (!canRender) {
      showError("Couldn't load the markdown renderer from cdnjs.cloudflare.com. Text is shown unrendered; you can still send your answer.");
    }

    if (cfg.mode === "write") {
      $("pill").textContent = "Writing a prompt for Claude";
      $("write").hidden = false;
      $("editor").addEventListener("input", refresh);
      $("tab-write").addEventListener("click", function () { showTab("write"); });
      $("tab-preview").addEventListener("click", function () { showTab("preview"); });
    } else {
      $("pill").textContent = cfg.file_name;
      $("show").hidden = false;
      var doc = $("document");
      if (cfg.is_markdown) {
        renderMarkdown(doc, cfg.document);
      } else {
        var pre = document.createElement("pre");
        var code = document.createElement("code");
        code.textContent = cfg.document;
        pre.appendChild(code);
        doc.appendChild(pre);
      }
      var meta = document.createElement("p");
      meta.className = "text-xs text-paper-muted dark:text-ink-muted";
      meta.textContent = cfg.file_path + " (" + cfg.file_size + " bytes)";
      doc.insertBefore(meta, doc.firstChild);
      $("answer").addEventListener("input", refresh);
    }

    refresh();
    source().focus();
  })();
</script>
</body>
</html>
